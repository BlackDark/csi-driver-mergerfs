# Layered volume: rclone CSI PVC + emptyDir as mergerfs branches.
#
# Pattern:
#   - PVC from an rclone CSI driver (placeholder name below) provides remote/cache data
#   - emptyDir provides local scratch
#   - mergerfs CSI ephemeral volume unions them via pvcRef + emptyDirRef
#
# Replace `rclone.csi.veloxpack.io` / StorageClass with your real rclone CSI install.
# ORDERING: rclone PVC + emptyDir must publish before mergerfs resolves refs.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rclone-branch-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rclone # must use your rclone CSI StorageClass
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: mergerfs-rclone-layered-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "ls -la /mnt/union; sleep 3600"]
      volumeMounts:
        # Branch mounts so kubelet creates host paths under pods/<uid>/volumes/...
        - name: remote
          mountPath: /remote
        - name: scratch
          mountPath: /scratch
        # App should prefer the union mount for cross-branch I/O.
        - name: union
          mountPath: /mnt/union
  volumes:
    # Placeholder rclone CSI PVC — driver name is illustrative only.
    - name: remote
      persistentVolumeClaim:
        claimName: rclone-branch-pvc
    - name: scratch
      emptyDir: {}
    - name: union
      csi:
        driver: mergerfs.csi.k8s.io
        volumeAttributes:
          # volumeName must match Pod volume names (remote, scratch).
          # pvcRef works for any CSI PVC mount (including rclone.csi.veloxpack.io).
          branches: '[{"type":"pvcRef","volumeName":"remote"},{"type":"emptyDirRef","volumeName":"scratch"}]'
          mergerfsOptions: "category.create=mfs,cache.files=partial"
