# Static PV using hostPath branches (node-local).
# Prefer node affinity so the pod lands on a node that has /data/a and /data/b.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mergerfs-static-hostpath
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: mergerfs.csi.k8s.io
    volumeHandle: mergerfs-static-hostpath-1
    volumeAttributes:
      # JSON array of branch descriptors (see docs/SPEC.md)
      branches: '[{"type":"hostPath","path":"/data/a"},{"type":"hostPath","path":"/data/b"}]'
      mergerfsOptions: "category.create=mfs,cache.files=partial"
  # Optional: pin PV to a node that has the host paths
  # nodeAffinity:
  #   required:
  #     nodeSelectorTerms:
  #       - matchExpressions:
  #           - key: kubernetes.io/hostname
  #             operator: In
  #             values: ["node-1"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mergerfs-static-hostpath
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: mergerfs-static-hostpath
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: mergerfs-hostpath-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "ls -la /mnt/union; sleep 3600"]
      volumeMounts:
        - name: union
          mountPath: /mnt/union
  volumes:
    - name: union
      persistentVolumeClaim:
        claimName: mergerfs-static-hostpath
