{{- $m := .Values.metrics -}}
{{- $full := include "csi-driver-mergerfs.fullname" . -}}
{{- if and $m.serviceMonitor.enabled (not (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1")) -}}
{{- fail "metrics.serviceMonitor needs the Prometheus Operator CRDs (monitoring.coreos.com/v1)" -}}
{{- end -}}
{{- if $m.enabled }}
{{- $components := list "node" -}}
{{- if .Values.controller.enabled }}{{ $components = append $components "controller" }}{{ end }}
{{- range $component := $components }}
---
# Headless: Prometheus scrapes every pod behind it.
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-{{ $component }}-metrics
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "csi-driver-mergerfs.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    mergerfs.csi.k8s.io/metrics: "true"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: csi-driver-mergerfs
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: metrics
      port: {{ $m.port }}
      targetPort: metrics
{{- end }}
{{- if $m.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $full }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-driver-mergerfs.labels" . | nindent 4 }}
    {{- with $m.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      mergerfs.csi.k8s.io/metrics: "true"
  endpoints:
    - port: metrics
      interval: {{ $m.serviceMonitor.interval }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: component
{{- end }}
{{- end }}
