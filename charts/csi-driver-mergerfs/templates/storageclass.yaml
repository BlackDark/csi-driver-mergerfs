{{- with .Values.storageClass }}
{{- if .enabled }}
# Deleting a PVC removes only the PV object; branch data stays (DeleteVolume is a no-op).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "csi-driver-mergerfs.labels" $ | nindent 4 }}
  {{- if .default }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: {{ include "csi-driver-mergerfs.driverName" $ }}
reclaimPolicy: {{ .reclaimPolicy }}
volumeBindingMode: Immediate
allowVolumeExpansion: false
parameters:
  {{- $_ := required "storageClass.parameters.branches is required" .parameters.branches }}
  {{- range $k, $v := .parameters }}
  {{ $k | quote }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
