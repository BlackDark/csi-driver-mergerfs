apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ include "csi-driver-mergerfs.driverName" . }}
  labels:
    {{- include "csi-driver-mergerfs.labels" . | nindent 4 }}
spec:
  attachRequired: false
  podInfoOnMount: true
  fsGroupPolicy: None
  requiresRepublish: false
  volumeLifecycleModes:
    - Persistent
    - Ephemeral
