apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "mergerfs-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mergerfs-csi.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "mergerfs-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "mergerfs-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: {{ include "mergerfs-csi.serviceAccountName" . }}
      hostNetwork: false
      priorityClassName: system-node-critical
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mergerfs-csi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --endpoint={{ .Values.driver.endpoint }}
            - --mode=node
            - --node-id=$(NODE_ID)
            - --kubelet-pods-path={{ .Values.driver.kubeletPodsPath }}
            - --state-dir={{ .Values.driver.stateDir }}
            - --mergerfs-path={{ .Values.driver.mergerfsPath }}
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: {{ .Values.privileged }}
            {{- if not .Values.privileged }}
            capabilities:
              add:
                - SYS_ADMIN
                {{- with .Values.extraCapabilities }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
            {{- end }}
            allowPrivilegeEscalation: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            # Bidirectional required: NodePublish target is under pods/<uid>/...
            # (branch resolve also reads this tree; RO alone would break mounts)
            - name: pods-mount-dir
              mountPath: {{ .Values.driver.kubeletPodsPath }}
              mountPropagation: Bidirectional
            - name: kubelet-dir
              mountPath: {{ .Values.hostPaths.kubeletDir }}
              mountPropagation: Bidirectional
            - name: state-dir
              mountPath: {{ .Values.driver.stateDir }}
            {{- if .Values.fuseDevice.enabled }}
            - name: fuse-device
              mountPath: {{ .Values.fuseDevice.path }}
            {{- end }}
        - name: node-driver-registrar
          image: "{{ .Values.sidecar.image.repository }}:{{ .Values.sidecar.image.tag }}"
          imagePullPolicy: {{ .Values.sidecar.image.pullPolicy }}
          args:
            - --csi-address=$(ADDRESS)
            - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
            - --v=2
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: {{ .Values.hostPaths.pluginDir }}/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: plugin-dir
          hostPath:
            path: {{ .Values.hostPaths.pluginDir }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.hostPaths.registrationDir }}
            type: Directory
        - name: pods-mount-dir
          hostPath:
            path: {{ .Values.hostPaths.kubeletPods }}
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: {{ .Values.hostPaths.kubeletDir }}
            type: Directory
        - name: state-dir
          hostPath:
            path: {{ .Values.hostPaths.stateDir }}
            type: DirectoryOrCreate
        {{- if .Values.fuseDevice.enabled }}
        - name: fuse-device
          hostPath:
            path: {{ .Values.fuseDevice.path }}
            type: CharDevice
        {{- end }}
