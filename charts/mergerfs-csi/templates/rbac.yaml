{{- if .Values.rbac.create }}
# Minimal RBAC for csi-node-driver-registrar (gets nodes via downward API; SA still required).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mergerfs-csi.fullname" . }}
  labels:
    {{- include "mergerfs-csi.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mergerfs-csi.fullname" . }}
  labels:
    {{- include "mergerfs-csi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mergerfs-csi.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mergerfs-csi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.controller.enabled }}
---
# external-provisioner permissions for dynamic CreateVolume
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mergerfs-csi.fullname" . }}-provisioner
  labels:
    {{- include "mergerfs-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mergerfs-csi.fullname" . }}-provisioner
  labels:
    {{- include "mergerfs-csi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mergerfs-csi.fullname" . }}-provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "mergerfs-csi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
