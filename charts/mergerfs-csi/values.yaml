image:
  repository: mergerfs-csi
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Optional pull secrets (e.g. private ghcr.io)
imagePullSecrets: []

driver:
  # Used by CSIDriver resource only (binary hardcodes name; no --driver-name flag)
  name: mergerfs.csi.k8s.io
  # CSI unix socket path inside the plugin container
  endpoint: unix:///csi/csi.sock
  kubeletPodsPath: /var/lib/kubelet/pods
  stateDir: /var/lib/mergerfs-csi
  mergerfsPath: /usr/local/bin/mergerfs

# Node plugin security — FUSE mounts need privileged or SYS_ADMIN + /dev/fuse
privileged: true
# When privileged=false, chart adds SYS_ADMIN + /dev/fuse device
extraCapabilities: []

fuseDevice:
  enabled: true
  path: /dev/fuse

# Host paths mounted into the DaemonSet
hostPaths:
  kubeletPods: /var/lib/kubelet/pods
  stateDir: /var/lib/mergerfs-csi
  # CSI plugin registration (kubelet)
  pluginDir: /var/lib/kubelet/plugins/mergerfs.csi.k8s.io
  registrationDir: /var/lib/kubelet/plugins_registry
  # Bidirectional mount of pods dir parent plugins path for volume publish targets
  kubeletDir: /var/lib/kubelet

sidecar:
  image:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.12.0
    pullPolicy: IfNotPresent

# Optional controller (dynamic provisioner). CreateVolume copies SC params → VolumeContext.
controller:
  enabled: false
  replicas: 1
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  provisioner:
    image:
      repository: registry.k8s.io/sig-storage/csi-provisioner
      tag: v5.1.0
      pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}

tolerations:
  - operator: Exists

affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

# Optional StorageClass (enable with controller for dynamic PVC)
storageClass:
  create: false
  name: mergerfs
  isDefault: false
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer
  # Example parameters (JSON string for branches — echoed into VolumeContext):
  #   branches: '[{"type":"hostPath","path":"/data/a"},{"type":"hostPath","path":"/data/b"}]'
  #   mergerfsOptions: "category.create=mfs,cache.files=partial"
  parameters:
    branches: '[{"type":"hostPath","path":"/data/a"},{"type":"hostPath","path":"/data/b"}]'
    mergerfsOptions: "category.create=mfs,cache.files=partial"

nameOverride: ""
fullnameOverride: ""
